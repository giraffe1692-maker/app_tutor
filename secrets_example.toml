# 이 파일을 복사해서 .streamlit/secrets.toml 로 저장하고 실제 값을 채워넣으세요.
# secrets.toml 은 절대 git에 커밋하지 마세요 (.gitignore에 추가).

SHEET_ID = "1KidghOU2KTJOpxRtoBcOWGpFiEs0cm8WRV-B9TxGHPs"

GROQ_API_KEY = "여기에_새로_발급받은_Groq_API_키를_입력하세요"
GROQ_MODEL = "llama-3.3-70b-versatile"
GROQ_FALLBACK_MODELS = ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]

# 구글 클라우드 콘솔에서 서비스 계정을 생성하고, 발급받은 JSON 키 파일의 내용을
# 아래 [gcp_service_account] 섹션에 그대로 옮겨 적으세요.
# 그리고 이 서비스 계정의 client_email 주소를 대상 구글 시트에 "편집자"로 공유해야 합니다.
[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project-id.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."
